name: Build and Release

on:
  push:
    branches: [ "main" ]
    paths:
      - "app/build.gradle"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from build.gradle
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle)
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Check if this version was already released
        id: check
        run: |
          if git ls-remote --tags origin | grep -q "refs/tags/${{ steps.version.outputs.tag }}$"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        if: steps.check.outputs.exists == 'false'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        if: steps.check.outputs.exists == 'false'
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        if: steps.check.outputs.exists == 'false'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        if: steps.check.outputs.exists == 'false'
        run: gradle assembleDebug

      - name: Rename APK
        if: steps.check.outputs.exists == 'false'
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/RecoveryFlash-${{ steps.version.outputs.version }}.apk"

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: RecoveryFlash ${{ steps.version.outputs.tag }}
          files: out/*.apk
          generate_release_notes: true

      - name: Skip notice
        if: steps.check.outputs.exists == 'true'
        run: echo "Version ${{ steps.version.outputs.version }} was already released as ${{ steps.version.outputs.tag }} — skipping."
