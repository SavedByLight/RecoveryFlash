plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.recoveryflash.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.recoveryflash.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.6"
    }

    signingConfigs {
        debug {
            // Fixed, checked-in debug keystore. Without this, AGP auto-generates a
            // random debug certificate on any machine that doesn't already have
            // ~/.android/debug.keystore — which is every fresh GitHub Actions runner.
            // That meant every CI build was signed with a *different* debug cert,
            // so installing a newer build over an older one failed with
            // "App not installed" (signature mismatch / INSTALL_FAILED_UPDATE_INCOMPATIBLE).
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        release {
            def ksPath = file("release.keystore")
            if (ksPath.exists()) {
                storeFile ksPath
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            // Only apply the signing config if a keystore is actually present (CI release builds).
            // Local `assembleRelease` without a keystore will just produce an unsigned APK.
            if (file("release.keystore").exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
