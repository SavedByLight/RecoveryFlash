plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.recoveryflash.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.recoveryflash.app"
        minSdk 24
        targetSdk 34
        versionCode 1-1-2
        versionName "1.1.2"
    }

    signingConfigs {
        release {
            def ksPath = file("release.keystore")
            if (ksPath.exists()) {
                storeFile ksPath
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Only apply the signing config if a keystore is actually present (CI release builds).
            // Local `assembleRelease` without a keystore will just produce an unsigned APK.
            if (file("release.keystore").exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
